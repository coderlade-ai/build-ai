name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, typecheck, test and build
    # Pinned: ubuntu-latest is moving to Ubuntu 26, which Playwright 1.56's --with-deps predates.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The browser check serves this preview origin locally (ADR 0016).
          NEXT_PUBLIC_PREVIEW_ORIGIN: http://127.0.0.1:4322

      - name: Builder CSP check
        run: pnpm --filter @ladestack/builder check:csp

      # Cache the Playwright browser so a slow download does not fail CI; retry once if it does.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            timeout 300 pnpm --filter @ladestack/builder exec playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt failed; retrying"
          done
          exit 1

      - name: Builder browser check (CSP, hydration, Monaco, preview)
        timeout-minutes: 6
        run: pnpm --filter @ladestack/builder check:browser
        env:
          NEXT_PUBLIC_PREVIEW_ORIGIN: http://127.0.0.1:4322
