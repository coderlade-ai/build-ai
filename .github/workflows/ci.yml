name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The browser check serves this preview origin locally (ADR 0016).
          NEXT_PUBLIC_PREVIEW_ORIGIN: http://127.0.0.1:4322

      - name: Builder CSP check
        run: pnpm --filter @ladestack/builder check:csp

      - name: Install Chromium
        run: pnpm --filter @ladestack/builder exec playwright install --with-deps chromium

      - name: Builder browser check (CSP, hydration, Monaco, preview)
        run: pnpm --filter @ladestack/builder check:browser
        env:
          NEXT_PUBLIC_PREVIEW_ORIGIN: http://127.0.0.1:4322
